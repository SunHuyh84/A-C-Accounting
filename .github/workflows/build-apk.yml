name: Build A&C Accounting Mobile APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      - name: Generate Gradle Wrapper & Make Executable
        run: |
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p build-output
          cp app/build/outputs/apk/debug/app-debug.apk build-output/AC_Accounting_Mobile.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AC_Accounting_Mobile_APK
          path: build-output/AC_Accounting_Mobile.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: "A&C Accounting Mobile v1.0.2"
          body: |
            ## 📱 A&C Accounting Mobile v1.0.2 (Official Build)
            - **Cảm biến vân tay phần cứng (BiometricPrompt):** Tích hợp xác thực sinh trắc học Android chính thức.
            - **Tự động nhận diện trạm Desktop:** Cấu hình mặc định đúng cổng 8765 và hỗ trợ chọn nhanh IP Wi-Fi nội bộ.
            - **Đăng nhập bằng mã PIN máy trạm (389210):** Cho phép nhập mã PIN máy trạm làm mật khẩu để kết nối ngay lập tức.
            - **Đồng bộ tài khoản Desktop:** Tự động nhận diện tài khoản đã được cấp trên máy tính và phân quyền MISA.
            - **Xử lý trạng thái đăng nhập mượt mà:** Khắc phục lỗi kẹt nút đăng nhập khi sai thông số mạng.
          files: build-output/AC_Accounting_Mobile.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
