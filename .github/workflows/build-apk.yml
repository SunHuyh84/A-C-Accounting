name: Build A&C Accounting Mobile APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      - name: Generate Gradle Wrapper & Make Executable
        run: |
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p build-output
          cp app/build/outputs/apk/debug/app-debug.apk build-output/AC_Accounting_Mobile.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AC_Accounting_Mobile_APK
          path: build-output/AC_Accounting_Mobile.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "A&C Accounting Mobile v1.0.0"
          body: |
            ## 📱 A&C Accounting Mobile v1.0.0 (Official Build)
            - **Hệ điều hành tương thích:** Android 7.0 - Android 15+ (Tối ưu cho Android 11, 12, 13)
            - **Dữ liệu:** Tích hợp đầy đủ danh mục tài khoản, sổ cái, đối tác và chứng từ A&C PANAP.
            - **Tải tệp:** Nhấp vào `AC_Accounting_Mobile.apk` bên dưới để tải trực tiếp về điện thoại và cài đặt.
          files: build-output/AC_Accounting_Mobile.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
