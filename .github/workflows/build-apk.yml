name: Build A&C Accounting Mobile APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      - name: Generate Gradle Wrapper & Make Executable
        run: |
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p build-output
          cp app/build/outputs/apk/debug/app-debug.apk build-output/AC_Accounting_Mobile.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AC_Accounting_Mobile_APK
          path: build-output/AC_Accounting_Mobile.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "A&C Accounting Mobile v1.0.1"
          body: |
            ## 📱 A&C Accounting Mobile v1.0.1 (Official Build)
            - **Bảo mật đăng nhập lần đầu:** Người dùng bắt buộc ở màn hình đăng nhập, không tự động đăng nhập tài khoản quản trị.
            - **Mã PIN ghép nối bảo mật:** Yêu cầu nhập đúng mã PIN ghép nối 6 số do Quản trị viên trạm Desktop cấp mới có thể tạo/kích hoạt tài khoản.
            - **Đăng nhập nhanh:** Tự động lưu tài khoản sau khi ghép nối thành công để những lần sau chỉ cần dùng Vân tay hoặc Mật khẩu đã lưu.
            - **Phân quyền an toàn:** Gán đúng vai trò kế toán viên, hạn chế rủi ro quyền quản trị.
          files: build-output/AC_Accounting_Mobile.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
